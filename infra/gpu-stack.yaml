AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Incident Commander mentor-scale test bed - three Spot machines in eu-north-1 forming one k3s cluster
  (ops - apps - gpu). No inbound access from the internet (default security group - members only),
  Session Manager for shells, and every machine terminates itself after SessionHours.
  Spec - .plans/mentor-scale-testbed-spec.md - driven by infra/gpu.sh.

Metadata:
  why: >-
    One AZ (g6 is offered in eu-north-1a and 1b only) avoids cross-AZ charges; Spot because the account's
    GPU quota is Spot-only; self-termination so a forgotten session cannot spend credits.

Parameters:
  SessionHours:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 20
    Description: Every machine shuts itself down (= terminates) after this many hours.
  K3sToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Shared secret the k3s agents use to join (generated by gpu.sh per session).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Default subnet of the chosen AZ (eu-north-1a or eu-north-1b).
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The default VPC security group (inbound only from itself, outbound to the internet).
  GpuInstanceType:
    Type: String
    Default: g6.xlarge
    AllowedValues: [g6.xlarge, g5.xlarge, g4dn.xlarge]
    Description: GPU machine (Spot capacity varies; gpu.sh tries g6, then g5, then g4dn).
  GpuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ic-gpu-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Tags: [{ Key: project, Value: incident-commander-gpu }]

  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ic-gpu-${AWS::StackName}
      Roles: [!Ref Role]

  Template:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        IamInstanceProfile: { Arn: !GetAtt Profile.Arn }
        InstanceInitiatedShutdownBehavior: terminate
        InstanceMarketOptions:
          MarketType: spot
          SpotOptions: { SpotInstanceType: one-time, InstanceInterruptionBehavior: terminate }
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        SecurityGroupIds: [!Ref SecurityGroupId]
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: project, Value: incident-commander-gpu }, { Key: stack, Value: !Ref AWS::StackName }]
          - ResourceType: volume
            Tags: [{ Key: project, Value: incident-commander-gpu }]

  Ops:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate: { LaunchTemplateId: !Ref Template, Version: !GetAtt Template.LatestVersionNumber }
      InstanceType: t3.large
      CreditSpecification: { CPUCredits: standard }
      ImageId: !Ref UbuntuAmi
      SubnetId: !Ref SubnetId
      BlockDeviceMappings: [{ DeviceName: /dev/sda1, Ebs: { VolumeSize: 30, VolumeType: gp3, DeleteOnTermination: true } }]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-ops" }, { Key: role, Value: ops }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ux
          shutdown -h +$(( ${SessionHours} * 60 )) "session time limit"
          IP=$(hostname -I | awk '{print $1}')
          mkdir -p /etc/rancher/k3s
          printf 'mirrors:\n  "registry.ic.local:5000":\n    endpoint: ["http://%s:5000"]\n' "$IP" > /etc/rancher/k3s/registries.yaml
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io docker-buildx >/dev/null
          docker run -d --restart=always -p 5000:5000 --name registry registry:2.8.3
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.31.5+k3s1 K3S_TOKEN='${K3sToken}' \
            sh -s - server --node-label role=ops --write-kubeconfig-mode 644
          V=v3.16.4; cd /tmp && curl -fsSLO https://get.helm.sh/helm-$V-linux-amd64.tar.gz \
            && echo "$(curl -fsSL https://get.helm.sh/helm-$V-linux-amd64.tar.gz.sha256sum | awk '{print $1}')  helm-$V-linux-amd64.tar.gz" | sha256sum -c - \
            && tar xzf helm-$V-linux-amd64.tar.gz && install linux-amd64/helm /usr/local/bin/helm
          touch /var/lib/ic-ops-ready

  Apps:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate: { LaunchTemplateId: !Ref Template, Version: !GetAtt Template.LatestVersionNumber }
      InstanceType: m7i.xlarge
      ImageId: !Ref UbuntuAmi
      SubnetId: !Ref SubnetId
      BlockDeviceMappings: [{ DeviceName: /dev/sda1, Ebs: { VolumeSize: 30, VolumeType: gp3, DeleteOnTermination: true } }]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-apps" }, { Key: role, Value: apps }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ux
          shutdown -h +$(( ${SessionHours} * 60 )) "session time limit"
          mkdir -p /etc/rancher/k3s
          printf 'mirrors:\n  "registry.ic.local:5000":\n    endpoint: ["http://%s:5000"]\n' "${Ops.PrivateIp}" > /etc/rancher/k3s/registries.yaml
          until curl -sk https://${Ops.PrivateIp}:6443/ping >/dev/null; do sleep 10; done
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.31.5+k3s1 K3S_URL=https://${Ops.PrivateIp}:6443 \
            K3S_TOKEN='${K3sToken}' sh -s - agent --node-label role=apps

  Gpu:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate: { LaunchTemplateId: !Ref Template, Version: !GetAtt Template.LatestVersionNumber }
      InstanceType: !Ref GpuInstanceType
      ImageId: !Ref GpuAmi
      SubnetId: !Ref SubnetId
      BlockDeviceMappings: [{ DeviceName: /dev/sda1, Ebs: { VolumeSize: 100, VolumeType: gp3, DeleteOnTermination: true } }]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-gpu" }, { Key: role, Value: gpu }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ux
          shutdown -h +$(( ${SessionHours} * 60 )) "session time limit"
          nvidia-smi -L || true
          mkdir -p /etc/rancher/k3s
          printf 'mirrors:\n  "registry.ic.local:5000":\n    endpoint: ["http://%s:5000"]\n' "${Ops.PrivateIp}" > /etc/rancher/k3s/registries.yaml
          until curl -sk https://${Ops.PrivateIp}:6443/ping >/dev/null; do sleep 10; done
          # the DLAMI ships the NVIDIA driver and container toolkit; k3s detects the nvidia runtime at start.
          # gpu.present: the device-plugin chart only schedules on nodes with that label (no NFD here)
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.31.5+k3s1 K3S_URL=https://${Ops.PrivateIp}:6443 \
            K3S_TOKEN='${K3sToken}' sh -s - agent --node-label role=gpu --node-label nvidia.com/gpu.present=true

Outputs:
  OpsId: { Value: !Ref Ops }
  AppsId: { Value: !Ref Apps }
  GpuId: { Value: !Ref Gpu }
  OpsIp: { Value: !GetAtt Ops.PrivateIp }
  GpuType: { Value: !Ref GpuInstanceType }
