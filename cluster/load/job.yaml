# A load run: Locust headless on the ops node, hitting the ingress inside the cluster.
# cluster/cluster.sh fills in NAME, MODE env and the -u/-t values (see `cluster.sh load`).
apiVersion: v1
kind: Namespace
metadata: { name: load }
---
apiVersion: batch/v1
kind: Job
metadata: { name: NAME, namespace: load }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { role: ops }
      containers:
        - name: locust
          image: locustio/locust:2.33.0
          args: ["-f", "/mnt/locustfile.py", "--headless", "-u", "USERS", "-r", "3", "-t", "MINUTESm",
                 "--host", "http://traefik.kube-system.svc.cluster.local", "--only-summary"]
          env:
            - { name: TRACE_FILE, value: "TRACE" }        # empty = constant load
            - { name: PEAK_USERS, value: "USERS" }
            - { name: HOURS, value: "TRACEHOURS" }
            - { name: TIME_SCALE, value: "24" }
          volumeMounts: [{ name: lf, mountPath: /mnt }, { name: traces, mountPath: /traces }]
          resources: { requests: { cpu: 200m, memory: 128Mi }, limits: { memory: 512Mi } }
      volumes:
        - { name: lf, configMap: { name: locustfile } }
        - { name: traces, configMap: { name: traces } }
