# prometheus-community/prometheus 29.37.0. Monitoring lives on the ops node so saturating the apps
# node never starves it. Scrapes: kubelet/cAdvisor (pod CPU/RAM), node-exporter (node CPU/RAM),
# kube-state-metrics (limits, restarts, OOMKilled), pods annotated prometheus.io/scrape (apps),
# and DCGM on AWS (GPU).
server:
  nodeSelector: { role: ops }
  global: { scrape_interval: 10s, evaluation_interval: 10s }
  retention: 7d
  persistentVolume: { enabled: false }     # local; on AWS the session report and Grafana snapshot are kept
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
prometheus-pushgateway: { enabled: false }
kube-state-metrics:
  nodeSelector: { role: ops }
prometheus-node-exporter:
  hostRootFsMount: { enabled: false }      # k3d nodes are containers; real hosts on AWS

# SLO-style alerts: what users and operators would notice, never the fault itself.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: pulse      # testbed/prometheus/alerts.yml, unchanged except ComponentDown's labels
        rules:
          - alert: SourceDisconnected
            expr: max by (source) (pulse_source_connected) == 0
            for: 2m
            labels: { severity: page }
            annotations: { summary: "Collector lost the {{ $labels.source }} stream" }
          - alert: IngestStalled
            expr: sum(rate(pulse_events_processed_total[2m])) == 0 and sum(rate(pulse_events_received_total[2m])) > 0
            for: 2m
            labels: { severity: page }
            annotations: { summary: "Events arrive but nothing is being stored" }
          - alert: WorkerLagHigh
            expr: pulse_stream_lag > 5000
            for: 3m
            labels: { severity: page }
            annotations: { summary: "Worker is {{ $value }} events behind" }
          - alert: DataStale
            expr: time() - max(pulse_source_last_event_timestamp_seconds) > 300
            labels: { severity: page }
            annotations: { summary: "No new events for 5 minutes" }
          - alert: ApiErrorRateHigh
            expr: sum(rate(pulse_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(pulse_http_requests_total[5m])), 1e-9) > 0.05
            for: 2m
            labels: { severity: page }
            annotations: { summary: "API 5xx rate above 5%" }
          - alert: ApiLatencyHigh
            expr: histogram_quantile(0.95, sum by (le) (rate(pulse_http_request_seconds_bucket[5m]))) > 1
            for: 3m
            labels: { severity: page }
            annotations: { summary: "API p95 latency above 1s" }
          - alert: DbWriteErrors
            expr: increase(pulse_db_errors_total[5m]) > 0
            labels: { severity: page }
            annotations: { summary: "Worker failing to write to Postgres" }
          - alert: RedisMemoryHigh
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
            for: 2m
            labels: { severity: page }
            annotations: { summary: "Redis above 80% of maxmemory" }
          - alert: ComponentDown
            expr: up{namespace="pulse"} == 0 or absent(up{namespace="pulse",app="api"})
            for: 1m
            labels: { severity: page }
            annotations: { summary: "{{ $labels.app }} is not answering scrapes" }
      - name: shop
        rules:
          - alert: ShopSlow
            expr: histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service=~"shop-juice-shop.*"}[2m]))) > 3
            for: 2m
            labels: { severity: page }
            annotations: { summary: "p95 latency of the shop above 3 s" }
          - alert: AssistantSlow     # an LLM endpoint: normal answers take seconds
            expr: histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service=~"shop-assistant.*"}[2m]))) > 30
            for: 2m
            labels: { severity: page }
            annotations: { summary: "p95 answer time of the AI assistant above 30 s" }
          - alert: ShopErrors
            expr: sum by (service) (rate(traefik_service_requests_total{service=~"shop-.*",code=~"5.."}[2m])) / sum by (service) (rate(traefik_service_requests_total{service=~"shop-.*"}[2m])) > 0.05
            for: 2m
            labels: { severity: page }
            annotations: { summary: "more than 5% errors from {{ $labels.service }}" }
          - alert: ShopClientErrors   # many refused or not-found requests: broken links, scans, attacks
            expr: sum(rate(traefik_service_requests_total{service=~"shop-juice-shop.*",code=~"4.."}[2m])) / sum(rate(traefik_service_requests_total{service=~"shop-juice-shop.*"}[2m])) > 0.2
            for: 2m
            labels: { severity: page }
            annotations: { summary: "more than 20% of the shop's requests answered 4xx" }
          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total{namespace="shop"}[5m]) > 0
            labels: { severity: page }
            annotations: { summary: "{{ $labels.container }} restarted in the last 5 minutes" }
          - alert: CPUSaturated
            expr: sum by (container) (rate(container_cpu_usage_seconds_total{namespace="shop",container!=""}[2m])) / sum by (container) (kube_pod_container_resource_limits{namespace="shop",resource="cpu"}) > 0.9
            for: 2m
            labels: { severity: page }
            annotations: { summary: "{{ $labels.container }} at its CPU limit" }
          - alert: AssistantBacklog
            expr: avg_over_time(sum(assistant_queue_depth)[3m:15s]) > 2
            labels: { severity: page }
            annotations: { summary: "questions are queueing for the model" }
          - alert: GPUMemoryFull
            expr: max(DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) > 0.95
            for: 2m
            labels: { severity: page }
            annotations: { summary: "GPU memory above 95%" }

alertmanager:
  enabled: true
  nodeSelector: { role: ops }
  persistence: { enabled: false }
  config:
    global: {}
    route:
      receiver: agent
      group_by: [alertname]
      group_wait: 20s
      group_interval: 1m
      repeat_interval: 5m
    receivers:
      - name: agent
        webhook_configs:
          - url: http://ic-agent.agent.svc:8080/alert
            send_resolved: true
