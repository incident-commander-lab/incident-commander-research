# The fault injector and its sealed answer key. Least privilege: it may change Deployments only in
# `shop` and Jobs only in `load`. The answer key lives on a volume in `chaos`, a namespace the agent
# has no access to.
apiVersion: v1
kind: Namespace
metadata: { name: chaos }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sealed, namespace: chaos }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 64Mi } } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: chaos, namespace: chaos }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: chaos-shop, namespace: shop }
rules:
  - { apiGroups: [apps], resources: [deployments], verbs: [get, list, patch] }
  - { apiGroups: [traefik.io], resources: [ingressroutes], verbs: [get, list] }   # attack_burst: is a client blocked?
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: chaos-shop, namespace: shop }
subjects: [{ kind: ServiceAccount, name: chaos, namespace: chaos }]
roleRef: { kind: Role, name: chaos-shop, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: chaos-load, namespace: load }
rules:
  - { apiGroups: [batch], resources: [jobs], verbs: [get, list, create, delete] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: chaos-load, namespace: load }
subjects: [{ kind: ServiceAccount, name: chaos, namespace: chaos }]
roleRef: { kind: Role, name: chaos-load, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: Namespace
metadata: { name: pulse }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: chaos-pulse, namespace: pulse }
rules:   # Pulse's faults: releases, scaling, freezing a process, the maintenance job holding a lock
  - { apiGroups: [apps], resources: [deployments], verbs: [get, list, patch] }
  - { apiGroups: [apps], resources: [deployments/scale], verbs: [get, patch, update] }
  - { apiGroups: [""], resources: [pods], verbs: [get, list] }
  - { apiGroups: [""], resources: [pods/exec], verbs: [create, get] }
  - { apiGroups: [batch], resources: [jobs], verbs: [get, list, create, delete] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: chaos-pulse, namespace: pulse }
subjects: [{ kind: ServiceAccount, name: chaos, namespace: chaos }]
roleRef: { kind: Role, name: chaos-pulse, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: chaos, namespace: chaos }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: chaos } }
  template:
    metadata: { labels: { app: chaos } }
    spec:
      serviceAccountName: chaos
      nodeSelector: { role: ops }
      containers:
        - name: chaos
          image: ic/chaos:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["serve"]                       # sessions: "slots" (fixed seeded schedule)
          env:
            - { name: FAULT_TIMEOUT_MIN, value: "15" }
            - { name: SURGE_USERS, value: "150" }
            - { name: REPLAY_IMAGE, value: "ic/replay:1.0.0" }   # attack_burst's attacker (cluster/load/replay)
            - { name: CHAOS_GPU_NUM_CTX, value: "16384" }   # local cap; larger on the AWS GPU
            - { name: CHAOS_SEED, value: "0" }
          volumeMounts: [{ name: sealed, mountPath: /sealed }]
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
      volumes: [{ name: sealed, persistentVolumeClaim: { claimName: sealed } }]
