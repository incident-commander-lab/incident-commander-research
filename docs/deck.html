<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incident Commander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1c3550;
      --panel: rgba(255, 255, 255, .08);
      --line: rgba(180, 210, 230, .22);
      --ink: #f6fbff;
      --muted: #c2d4e4;
      --accent: #5ee0f0;
      --accent2: #2a8a9a;
      --ok: #5ed39a;
      --bad: #ff7a7a;
      --warn: #ffc45a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif; overflow: hidden; }
    body {
      background:
        radial-gradient(90vw 70vh at 8% -10%, rgba(94, 224, 240, .28), transparent 52%),
        radial-gradient(70vw 60vh at 100% 110%, rgba(40, 90, 150, .55), transparent 48%),
        linear-gradient(155deg, #244a6e 0%, #1e4668 38%, #1a5a72 72%, #163a58 100%);
      background-color: #1e4668;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
      background-image:
        linear-gradient(rgba(180,210,230,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,210,230,.35) 1px, transparent 1px);
      background-size: 72px 72px;
    }
    .app { height: 100%; display: grid; grid-template-rows: 1fr 56px; position: relative; z-index: 1; }
    .stage { position: relative; overflow: hidden; }
    .slide {
      position: absolute; inset: 0; display: none; padding: 36px 64px 20px;
      flex-direction: column;
    }
    .slide.on { display: flex; animation: in .4s cubic-bezier(.2,.8,.2,1); }
    @keyframes in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .kicker {
      color: var(--accent); font-size: 14px; font-weight: 600;
      letter-spacing: .2em; text-transform: uppercase; margin-bottom: 8px;
      font-family: "IBM Plex Mono", monospace;
    }
    h1 { font-size: clamp(32px, 4.2vw, 52px); letter-spacing: -.04em; line-height: 1.08; font-weight: 700; }
    .lede { color: var(--muted); font-size: 22px; margin: 12px 0 18px; max-width: 980px; line-height: 1.35; }
    .grow { flex: 1; min-height: 0; }
    .grow.stack { display: flex; flex-direction: column; justify-content: center; }
    .grow.cols { align-content: center; }
    .grow.case { align-content: center; }
    .grow.built, .grow.path, .grow.live { height: 100%; }
    .take {
      margin-top: 16px; padding: 16px 18px; border-top: 0;
      background: rgba(0,0,0,.18); border: 1px solid var(--line); border-radius: 8px;
      font-size: 22px; font-weight: 600; line-height: 1.4;
    }
    .take em { color: var(--accent); font-style: normal; }
    .hint { color: var(--muted); font-size: 16px; margin-top: 8px; font-weight: 400; }

    .node {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px 20px; backdrop-filter: blur(14px);
    }
    .node b { display: block; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .node p { margin-top: 6px; font-size: 18px; color: var(--ink); line-height: 1.35; }
    .node.accent { background: var(--accent); border-color: var(--accent); color: #083038; }
    .node.accent b { color: #0b3a42; }
    .node.accent p { color: #083038; font-weight: 600; }
    .node.gap {
      background: rgba(255, 196, 90, .12); border-color: var(--warn);
      box-shadow: 0 12px 40px rgba(255,196,90,.12);
    }
    .node.gap b { color: var(--warn); font-size: 15px; }
    .node.gap p { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
    .v { color: var(--accent); text-align: center; height: 22px; line-height: 22px; font-size: 16px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pct { font-family: "IBM Plex Mono", monospace; font-size: 42px; font-weight: 600; letter-spacing: -.04em; }
    .pct small { display: block; font-size: 13px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; font-weight: 500; }

    .cols { display: grid; gap: 22px; }
    .cols.two { grid-template-columns: 1fr 1fr; }
    .cols.three { grid-template-columns: 1fr 1fr 1fr; }
    .cols.obs { grid-template-columns: 1.1fr .9fr; align-items: start; }

    .stack { display: flex; flex-direction: column; align-items: stretch; max-width: 860px; margin: 0 auto; width: 100%; }
    .pills { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .pill {
      border: 1px solid var(--line); border-radius: 8px; padding: 16px 12px;
      text-align: center; font-size: 16px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--ink); background: var(--panel);
    }
    .select {
      background: var(--accent); color: #083038; border-radius: 8px; padding: 18px 16px; text-align: center;
    }
    .select strong { display: block; font-size: 22px; }
    .select span { font-size: 14px; opacity: .8; letter-spacing: .08em; text-transform: uppercase; }

    .cmp { width: 100%; border-collapse: collapse; }
    .cmp th { text-align: left; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0 12px 12px; }
    .cmp th.on { color: var(--accent); }
    .cmp td { padding: 14px 12px; border-top: 1px solid var(--line); font-size: 18px; vertical-align: top; }
    .cmp td:last-child { color: var(--ink); font-weight: 600; }
    .cmp td:first-child { color: var(--muted); }

    .metric {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 16px;
    }
    .metric .n {
      font-family: "IBM Plex Mono", monospace; font-size: 40px; font-weight: 600;
      letter-spacing: -.05em; color: var(--ink); line-height: 1;
    }
    .metric.hero { border-color: var(--accent); background: rgba(94,224,240,.12); }
    .metric.hero .n { color: var(--accent); font-size: 72px; }
    .metric .l { margin-top: 10px; color: var(--muted); font-size: 15px; }

    .chain { display: flex; gap: 0; align-items: stretch; }
    .chain .step {
      flex: 1; background: var(--panel); border: 1px solid var(--line); padding: 16px 8px;
      text-align: center; font-size: 14px; font-weight: 600; line-height: 1.3;
    }
    .chain .step.on { background: var(--accent); color: #083038; border-color: var(--accent); }
    .chain .arr { display: flex; align-items: center; color: var(--accent); padding: 0 6px; font-size: 16px; }

    .eval { width: 100%; border-collapse: collapse; }
    .eval th, .eval td { padding: 16px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: 18px; }
    .eval th { color: var(--muted); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    .eval td.n { font-family: "IBM Plex Mono", monospace; font-size: 26px; font-weight: 600; }
    .eval td.on { color: var(--accent); }
    .eval td.off { color: var(--muted); }

    .list { list-style: none; display: grid; gap: 12px; margin-top: 14px; }
    .list li { font-size: 20px; padding-left: 18px; position: relative; }
    .list li:before { content: ""; position: absolute; left: 0; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .list.warn li:before { background: var(--warn); }
    .list.ok li:before { background: var(--ok); }

    .pred { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pred .pct.ok { color: var(--ok); }
    .pred .pct.bad { color: var(--bad); }

    .case { display: grid; gap: 12px; width: 100%; max-width: none; }
    .case .row {
      display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
    }
    .case .num { font-family: "IBM Plex Mono", monospace; color: var(--accent); font-size: 28px; font-weight: 600; }
    .case h3 { font-size: 22px; font-weight: 600; }
    .case p { color: var(--muted); font-size: 17px; margin-top: 4px; }

    .bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px 0 20px; border-top: 1px solid var(--line); background: rgba(8, 24, 40, .45);
      color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
      font-family: "IBM Plex Mono", monospace;
    }
    .progress { position: absolute; left: 0; right: 0; bottom: 56px; height: 3px; background: rgba(255,255,255,.12); }
    .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s ease; }
    .keys { opacity: .75; }
    kbd {
      border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; font-size: 11px;
      font-family: inherit;
    }

    .quote {
      margin-top: 8px; padding: 20px 22px; border: 1px solid var(--warn);
      background: rgba(255,196,90,.12); border-radius: 10px; font-size: 22px; font-weight: 600; line-height: 1.4;
    }
    .quote span { display: block; color: var(--warn); font-size: 13px; letter-spacing: .16em; margin-bottom: 8px; font-family: "IBM Plex Mono", monospace; }

    .side { color: var(--muted); font-size: 18px; line-height: 1.5; max-width: none; }
    .loop { font-size: 22px; line-height: 1.75; color: var(--muted); }
    .loop b { color: var(--ink); font-weight: 600; }
    .loop .hi { color: #083038; background: var(--accent); padding: 2px 8px; border-radius: 4px; }

    .built { display: grid; grid-template-columns: 300px 1fr; gap: 28px; height: 100%; min-height: 0; }
    .built .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: stretch; }
    .built .metrics .metric { min-height: 92px; display: flex; flex-direction: column; justify-content: center; }
    .built .metrics .hero { grid-column: 1 / -1; min-height: 140px; }
    .pipe { display: flex; flex-direction: column; height: 100%; }
    .pipe .pstep {
      flex: 1; display: flex; align-items: center; gap: 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 0 18px; margin-bottom: 8px; font-size: 18px; font-weight: 600;
    }
    .pipe .pstep:last-child { margin-bottom: 0; }
    .pipe .pstep.on { background: var(--accent); color: #083038; border-color: var(--accent); }
    .pipe .idx {
      font-family: "IBM Plex Mono", monospace; color: var(--accent); font-size: 15px; width: 28px;
    }
    .pipe .pstep.on .idx { color: #083038; }

    .path { display: grid; grid-template-rows: auto repeat(5, 1fr) auto; gap: 10px; height: 100%; min-height: 0; }
    .path .row {
      display: grid; grid-template-columns: 72px 1fr 1.4fr; gap: 16px; align-items: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px;
    }
    .path .row.now { border-color: var(--accent); background: rgba(94,224,240,.12); }
    .path .row.end { background: var(--accent); color: #083038; border-color: var(--accent); }
    .path .ph {
      font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--accent); font-weight: 600;
    }
    .path .row.end .ph { color: #083038; }
    .path .pt { font-size: 20px; font-weight: 700; }
    .path .pd { font-size: 16px; color: var(--muted); }
    .path .row.end .pd { color: #0b3a42; }

    .live { display: grid; grid-template-columns: 1.15fr .85fr; gap: 24px; height: 100%; min-height: 0; }
    .live .case { height: 100%; align-content: stretch; }
    .live .case .row { min-height: 0; }
    .live .aside {
      display: flex; flex-direction: column; justify-content: space-between;
      background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 22px;
    }
    .live .aside h3 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .live .aside p { font-size: 18px; line-height: 1.45; }
    .live .go {
      margin-top: 18px; font-size: 22px; font-weight: 700; color: var(--accent);
    }

    @media (max-width: 900px) {
      .slide { padding: 28px 22px 16px; }
      h1 { font-size: 26px; }
      .cols.two, .cols.obs, .cols.three, .split, .pred { grid-template-columns: 1fr; }
      .chain { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage"></div>
    <div class="progress"><i id="prog"></i></div>
    <footer class="bar">
      <span>Incident Commander · investigation policy</span>
      <span class="keys"><kbd>←</kbd> <kbd>→</kbd>  ·  <kbd>F</kbd> fullscreen</span>
      <span id="pos">01 / 13</span>
    </footer>
  </div>

  <template id="slides">
    <!-- 1 -->
    <section class="slide">
      <div class="kicker">01  ·  problem</div>
      <h1>When production breaks,<br>finding the cause is not enough.</h1>
      <p class="lede">The real challenge is deciding what to investigate next.</p>
      <div class="grow stack">
        <div class="node"><b>Production incident</b></div>
        <div class="v">↓</div>
        <div class="node"><b>Multiple plausible root causes</b><p>First-screen evidence still fits more than one story.</p></div>
        <div class="v">↓</div>
        <div class="split">
          <div class="node"><b>Hypothesis H1</b><div class="pct">48%<small>illustrative split</small></div></div>
          <div class="node"><b>Hypothesis H2</b><div class="pct">41%<small>illustrative split</small></div></div>
        </div>
        <div class="v">↓</div>
        <div class="node gap"><b>The gap</b><p>What should we investigate next?</p></div>
        <div class="v">↓</div>
        <div class="node accent"><b>Next best evidence</b></div>
      </div>
      <div class="take">Traditional RCA asks: <em>which cause is most likely?</em><br>Our approach asks: <em>what evidence should we collect next to reduce uncertainty?</em></div>
    </section>

    <!-- 2 -->
    <section class="slide">
      <div class="kicker">02  ·  positioning</div>
      <h1>From observability to investigation</h1>
      <p class="lede">Observability shows what is happening. We focus on what to investigate next.</p>
      <div class="grow cols obs">
        <div>
          <div class="node"><b>Existing observability</b></div>
          <div class="v">↓</div>
          <div class="pills">
            <div class="pill">Metrics</div>
            <div class="pill">Logs</div>
            <div class="pill">Traces</div>
          </div>
          <div class="v">↓</div>
          <p class="lede" style="margin:8px 0 12px;text-align:center">“What is happening?”</p>
          <div class="node" style="padding:18px 16px">
            <b>Investigation layer</b>
            <p style="margin:10px 0;color:var(--muted)">Competing hypotheses</p>
            <div class="v">↓</div>
            <div class="select"><strong>Evidence selection</strong><span>under uncertainty</span></div>
            <div class="v">↓</div>
            <p style="text-align:center;color:var(--muted)">Belief update</p>
          </div>
          <p class="lede" style="margin:14px 0 0;text-align:center;color:var(--accent);font-weight:600">“What should we investigate next?”</p>
        </div>
        <div class="side">
          Modern observability already provides visibility, correlation, RCA, and AI-assisted incident analysis. That stack is assumed — not replaced.
        </div>
      </div>
      <div class="take">We are not replacing observability — we build an <em>investigation layer</em> on top of it.</div>
    </section>

    <!-- 3 -->
    <section class="slide">
      <div class="kicker">03  ·  research gap</div>
      <h1>Where current AI-SRE research still falls short</h1>
      <p class="lede">Agents can reason about incidents. Evaluations still report recurring process failures.</p>
      <div class="grow cols two">
        <div class="node">
          <b>Final diagnosis</b>
          <p style="margin:12px 0 8px;color:var(--muted)">“Can the agent identify the root cause?”</p>
          <ul class="list warn">
            <li>Incomplete exploration</li>
            <li>Hallucinated data interpretation</li>
            <li>Inefficient investigation</li>
            <li>Large end-to-end performance gaps</li>
          </ul>
        </div>
        <div class="node accent">
          <b>Investigation process</b>
          <p style="margin-top:14px;font-size:20px;line-height:1.35">“Can the agent choose the right evidence to collect next?”</p>
          <p style="margin-top:14px;opacity:.8">Quality of the path, not only the final label.</p>
        </div>
      </div>
      <div class="quote"><span>Research gap</span>Current systems often emphasize the quality of the final diagnosis. We focus on the quality of the investigation process that leads to it.</div>
    </section>

    <!-- 4 -->
    <section class="slide">
      <div class="kicker">04  ·  where it fits</div>
      <h1>A production microservices incident</h1>
      <div class="grow" style="display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center">
        <div class="stack" style="margin:0;max-width:none">
          <div class="node"><b>Production environment</b><p>Cloud · Kubernetes · microservices — the existing stack</p></div>
          <div class="v">↓</div>
          <div class="pills">
            <div class="pill">Metrics</div>
            <div class="pill">Logs</div>
            <div class="pill">Traces</div>
          </div>
          <div class="v">↓</div>
          <div class="node accent"><b>Our system</b><p>What should I investigate next?</p></div>
          <div class="v">↓</div>
          <div class="node"><b>Recommended check → SRE / IC → new evidence → updated beliefs</b></div>
        </div>
        <div>
          <div class="node" style="margin-bottom:10px"><b>On-call SRE</b><p>Where to start, instead of picking the next check by habit.</p></div>
          <div class="node" style="margin-bottom:10px"><b>Incident commander</b><p>The reason for the recommended check. Human stays in the loop.</p></div>
          <div class="node"><b>Complex microservices</b><p>When several causes still fit a large evidence surface.</p></div>
        </div>
      </div>
      <div class="take">Observability provides the evidence. Our system helps decide <em>which evidence to investigate next</em>.</div>
    </section>

    <!-- 5 -->
    <section class="slide">
      <div class="kicker">05  ·  difference</div>
      <h1>From root-cause ranking to investigation decisions</h1>
      <div class="grow cols two" style="margin-top:18px">
        <table class="cmp">
          <thead><tr><th>Traditional RCA</th><th class="on">Our approach</th></tr></thead>
          <tbody>
            <tr><td>Rank causes</td><td>Maintain competing hypotheses</td></tr>
            <tr><td>Most likely cause</td><td>Identify remaining uncertainty</td></tr>
            <tr><td>Answer-oriented</td><td>Investigation-oriented</td></tr>
            <tr><td>Evidence as input</td><td>Evidence as a decision signal</td></tr>
            <tr><td>Often one-shot</td><td>Sequential</td></tr>
            <tr><td>What is the cause?</td><td>What should we check next?</td></tr>
          </tbody>
        </table>
        <div class="stack" style="margin:0;max-width:none">
          <div class="node"><b>H1</b><p>predicts wait / latency rises first</p></div>
          <div class="node"><b>H2</b><p>predicts wait / latency rises later</p></div>
          <div class="v">↓</div>
          <div class="node gap"><b>Different predictions</b><p style="font-size:16px">The check they disagree about</p></div>
          <div class="v">↓</div>
          <div class="node accent"><b>Check wait-time behavior</b><p>Then update · then the next check</p></div>
        </div>
      </div>
      <div class="take">The system does not stop at “which hypothesis is most likely?” — it asks what evidence would <em>distinguish</em> the remaining hypotheses.</div>
    </section>

    <!-- 6 -->
    <section class="slide">
      <div class="kicker">06  ·  how it works</div>
      <h1>The investigation is iterative</h1>
      <p class="lede">Every observation changes what should be investigated next.</p>
      <div class="grow cols two">
        <div class="loop">
          Incident<br>↓<br>
          <b>Competing hypotheses</b><br>↓<br>
          Current beliefs<br>↓<br>
          Candidate probes<br>↓<br>
          <span class="hi">Select next investigation</span><br>↓<br>
          Collect evidence<br>↓<br>
          Update beliefs<br>↓<br>
          Repeat until convergence
        </div>
        <div>
          <div class="node accent" style="margin-bottom:12px">
            <b>Not one-shot RCA</b>
            <p>The loop returns to beliefs. A new observation can change the next check.</p>
          </div>
          <div class="node">
            <b>Stopping — in this prototype</b>
            <p>Continue while residual uncertainty remains and a discriminating check still exists.</p>
            <p style="margin-top:10px;font-family:'IBM Plex Mono',monospace;color:var(--accent)">τ = 0.15 · max 4 probes · 45s wall</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 7 -->
    <section class="slide">
      <div class="kicker">07  ·  what we built</div>
      <h1>A working offline investigation engine</h1>
      <div class="grow built">
        <div class="metrics">
          <div class="metric hero"><div class="n">8</div><div class="l">Recorded incident bundles</div></div>
          <div class="metric"><div class="n">3</div><div class="l">Analytical lenses</div></div>
          <div class="metric"><div class="n">4</div><div class="l">Max probes / case</div></div>
          <div class="metric"><div class="n">45s</div><div class="l">Wall-time budget</div></div>
          <div class="metric"><div class="n">0.15</div><div class="l">Convergence τ</div></div>
          <div class="metric" style="grid-column:1/-1"><div class="n">ON / OFF</div><div class="l">Probe ablation harness</div></div>
        </div>
        <div class="pipe">
          <div class="pstep"><span class="idx">01</span> Incident bundle</div>
          <div class="pstep"><span class="idx">02</span> Seeded hypotheses</div>
          <div class="pstep"><span class="idx">03</span> Change · telemetry · history lenses</div>
          <div class="pstep"><span class="idx">04</span> Belief reconciliation</div>
          <div class="pstep on"><span class="idx">05</span> Probe selection — discrimination / cost</div>
          <div class="pstep"><span class="idx">06</span> Evidence from the case fixture</div>
          <div class="pstep"><span class="idx">07</span> Belief update</div>
          <div class="pstep"><span class="idx">08</span> Convergence</div>

  <script>
    const stage = document.getElementById("stage");
    const tpl = document.getElementById("slides");
    [...tpl.content.children].forEach((el) => stage.appendChild(el));
    const slides = [...stage.querySelectorAll(".slide")];
    let i = 0;
    const pos = document.getElementById("pos");
    const prog = document.getElementById("prog");

    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, k) => s.classList.toggle("on", k === i));
      pos.textContent = String(i + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
      prog.style.width = ((i + 1) / slides.length * 100) + "%";
    }
    show(0);

    addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
      if (e.key === "f" || e.key === "F") document.documentElement.requestFullscreen?.();
    });
    addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      show(e.clientX > innerWidth * 0.62 ? i + 1 : e.clientX < innerWidth * 0.38 ? i - 1 : i);
    });
  </script>
