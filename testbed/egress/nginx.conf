# The collector's path to the internet. TLS passes through untouched (stream module, no
# termination), so the collector still talks to the real stream.wikimedia.org certificate.
# The `upstream_cut` fault stops this container: the internet "goes away" for the collector
# while everything we own keeps running. The agent has no check on it, like a real ISP.
events {}
stream {
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  server {
    listen 443;
    proxy_pass stream.wikimedia.org:443;
    proxy_connect_timeout 10s;
  }
  # Health port: in replay mode the collector probes this to know whether "the internet" is
  # up, without opening connections to Wikimedia. It goes away with the container.
  server {
    listen 8443;
    return "ok\n";
  }
}
