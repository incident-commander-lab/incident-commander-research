# RQ3 live test bed, week 1: real Wikipedia edit stream -> Redis -> worker -> Postgres -> API,
# with Prometheus, Alertmanager and Grafana. Local development; the AWS/Kubernetes version
# comes after the faults and the agent hook (week 2).
#
#   cd testbed && docker compose up -d --build
#   API http://localhost:3300/api/top   Grafana http://localhost:3301   Prometheus http://localhost:9390
name: pulse

x-app: &app
  build: ./app
  restart: unless-stopped
  environment: &appenv
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
  depends_on:
    redis: { condition: service_healthy }
    postgres: { condition: service_healthy }

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pulse, POSTGRES_PASSWORD: pulse, POSTGRES_DB: pulse }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "pulse"], interval: 5s, retries: 10 }

  collector:
    <<: *app
    environment:
      <<: *appenv
      RELEASE_FILE: /releases/collector.json
      ROLE: collector
      SERVICE_NAME: collector
      METRICS_PORT: "9101"
      RECORD_DIR: /recordings
      USER_AGENT: ${USER_AGENT:-pulse-testbed/0.1 (research test bed)}
      REPLAY_FILE: ${REPLAY_FILE:-}
      REPLAY_SPEED: ${REPLAY_SPEED:-1}
    volumes: ["./recordings:/recordings", "releases:/releases:ro"]
    user: root   # writes recordings to the bind mount
    # reach Wikimedia through the egress relay (the "internet path" the upstream_cut fault breaks)
    extra_hosts: ["stream.wikimedia.org:${EGRESS_IP:-10.89.77.50}"]

  egress:
    image: nginx:1.27-alpine
    volumes: ["./egress/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: { default: { ipv4_address: "${EGRESS_IP:-10.89.77.50}" } }
    restart: unless-stopped

  worker:
    <<: *app
    environment: { <<: *appenv, ROLE: worker, SERVICE_NAME: worker, METRICS_PORT: "9102", RELEASE_FILE: /releases/worker.json }
    volumes: ["releases:/releases:ro"]

  api:
    <<: *app
    environment: { <<: *appenv, ROLE: api, SERVICE_NAME: api, PORT: "3000" }
    ports: ["${API_PORT:-3300}:3000"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment: { REDIS_ADDR: redis://redis:6379 }
    depends_on: [redis]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment: { DATA_SOURCE_NAME: "postgresql://pulse:pulse@postgres:5432/pulse?sslmode=disable" }
    depends_on: [postgres]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus      # keep metric history across stop/start
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    ports: ["${PROM_PORT:-9390}:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./alertmanager:/etc/alertmanager:ro"]
    ports: ["${AM_PORT:-9393}:9093"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3301}:3000"]

  # ---------------------------------------------------------------- week 2: faults, agent, policy
  opa:
    image: openpolicyagent/opa:1.4.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    volumes: ["./policy:/policy:ro"]

  chaos:
    build: { context: .., dockerfile: testbed/ops/Dockerfile }
    command: ["python", "-m", "testbed_ops.chaos", "${CHAOS_MODE:-serve}"]
    environment:
      CHAOS_MEAN_GAP_MIN: ${CHAOS_MEAN_GAP_MIN:-30}
      FAULT_TIMEOUT_MIN: ${FAULT_TIMEOUT_MIN:-20}
      CHAOS_SEED: ${CHAOS_SEED:-0}
      CHAOS_FAULTS: ${CHAOS_FAULTS:-}          # comma-separated subset (default: all)
      CHAOS_SLOT_MIN: ${CHAOS_SLOT_MIN:-25}    # slots mode: one fault per slot
      CHAOS_SLOTS: ${CHAOS_SLOTS:-100}
      CHAOS_JITTER_MIN: ${CHAOS_JITTER_MIN:-3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - releases:/releases
      - state:/state
      - sealed:/sealed          # the answer key: only the injector mounts it
    depends_on: [postgres, redis]
    restart: unless-stopped

  agent:
    build: { context: .., dockerfile: testbed/ops/Dockerfile }
    command: ["uvicorn", "testbed_ops.agent:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      AUTONOMY: ${AUTONOMY:-shadow}
      AGENT_KIND: ${AGENT_KIND:-rule}          # rule (ours, frozen) | llm (plain LLM agent, setup 2)
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      VERIFY_SECONDS: ${VERIFY_SECONDS:-120}
      IC_PROVIDER: openrouter_models
      IC_OPENROUTER_MODELS: ollama:${AGENT_MODEL:-qwen3:8b}
      IC_STRICT_PROVIDER: "1"
      IC_OLLAMA_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      IC_LLM_TIMEOUT: "300"
    extra_hosts: ["host.docker.internal:host-gateway"]   # Linux; Docker Desktop has it already
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - releases:/releases
      - state:/state
      - ./incidents:/incidents
    ports: ["${AGENT_PORT:-8380}:8080"]
    depends_on: [opa, prometheus]
    restart: unless-stopped

networks:
  default:
    ipam: { config: [{ subnet: "${PULSE_SUBNET:-10.89.77.0/24}" }] }   # fixed, so the egress relay has a known address

volumes:
  pgdata:
  promdata:
  releases:
  state:
  sealed:
