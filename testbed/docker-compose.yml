# RQ3 live test bed, week 1: real Wikipedia edit stream -> Redis -> worker -> Postgres -> API,
# with Prometheus, Alertmanager and Grafana. Local development; the AWS/Kubernetes version
# comes after the faults and the agent hook (week 2).
#
#   cd testbed && docker compose up -d --build
#   API http://localhost:3300/api/top   Grafana http://localhost:3301   Prometheus http://localhost:9390
name: pulse

x-app: &app
  build: ./app
  restart: unless-stopped
  environment: &appenv
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
  depends_on:
    redis: { condition: service_healthy }
    postgres: { condition: service_healthy }

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pulse, POSTGRES_PASSWORD: pulse, POSTGRES_DB: pulse }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "pulse"], interval: 5s, retries: 10 }

  collector:
    <<: *app
    environment:
      <<: *appenv
      ROLE: collector
      SERVICE_NAME: collector
      METRICS_PORT: "9101"
      RECORD_DIR: /recordings
      USER_AGENT: ${USER_AGENT:-pulse-testbed/0.1 (research test bed)}
      REPLAY_FILE: ${REPLAY_FILE:-}
      REPLAY_SPEED: ${REPLAY_SPEED:-1}
    volumes: ["./recordings:/recordings"]
    user: root   # writes recordings to the bind mount

  worker:
    <<: *app
    environment: { <<: *appenv, ROLE: worker, SERVICE_NAME: worker, METRICS_PORT: "9102" }

  api:
    <<: *app
    environment: { <<: *appenv, ROLE: api, SERVICE_NAME: api, PORT: "3000" }
    ports: ["${API_PORT:-3300}:3000"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment: { REDIS_ADDR: redis://redis:6379 }
    depends_on: [redis]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment: { DATA_SOURCE_NAME: "postgresql://pulse:pulse@postgres:5432/pulse?sslmode=disable" }
    depends_on: [postgres]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["${PROM_PORT:-9390}:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./alertmanager:/etc/alertmanager:ro"]
    ports: ["${AM_PORT:-9393}:9093"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3301}:3000"]

volumes:
  pgdata:
